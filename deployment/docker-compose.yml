version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: security-postgres
    env_file:
      - ./env/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_user -d security_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka (KRaft mode - without Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: security-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094,PLAINTEXT_INTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: security-kafka-cluster
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: security-minio
    ports:
      - "9000:9000"      # API port
      - "9001:9001"      # Console UI port
    env_file:
      - ./env/minio.env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client for bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: security-minio-init
    env_file:
      - ./env/minio.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb myminio/security-videos --ignore-existing;
      mc anonymous set download myminio/security-videos;
      echo 'MinIO bucket initialized successfully';
      exit 0;
      "

  # Kafka Topic Initialization
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: security-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic security-events --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic uploaded-videos --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic pipeline-classification-requests --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic pipeline-tracking-requests --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic pipeline-vlm-requests --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic pipeline-banknote-requests --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic pipeline-stage-results --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic pipeline-dead-letter --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic classification-dead-letter --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic tracking-dead-letter --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic vlm-dead-letter --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic banknote-dead-letter --partitions 3 --replication-factor 1;
      echo 'Kafka topics created successfully';
      exit 0;
      "

  # Kafka UI (Web interface for Kafka)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: security-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ./env/kafka-ui.env
    restart: unless-stopped

  # Event Processor Service
  event-processor:
    image: be-event-processor:latest
    container_name: security-event-processor
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      master-service:
        condition: service_started
    env_file:
      - ./env/event-processor.env
    restart: unless-stopped
    volumes:
      - ./templates:/app/templates:ro  # Mount email templates (read-only)

  # Master Service
  master-service:
    image: be-master-service:latest
    container_name: security-master-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./env/master-service.env
    restart: unless-stopped

  # Redis - Message Broker for Celery
  redis:
    image: redis:7-alpine
    container_name: security-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Celery Worker - Video Stream Processing
  celery-worker:
    image: be-celery-worker:latest
    container_name: security-celery-worker
    depends_on:
      redis:
        condition: service_healthy
      master-service:
        condition: service_started
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ./env/celery-worker.env
    restart: unless-stopped
    volumes:
      - ./videos:/app/videos

  # Classification Stage Service
  classification-service:
    image: be-classification-service:latest
    container_name: security-classification-service
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./env/classification-service.env
    restart: unless-stopped
    volumes:
      - /tmp/videos:/tmp/videos
      - ./models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              options:
                mem_limit: "6g"

  # Tracking Stage Service
  tracking-service:
    image: be-tracking-service:latest
    container_name: security-tracking-service
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./env/tracking-service.env
    restart: unless-stopped
    volumes:
      - /tmp/videos:/tmp/videos
      - ./models:/mnt/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              options:
                mem_limit: "6g"

  # Banknote detection stage — gates VLM so only videos with cash go to the VLM
  banknote-detector-service:
    profiles: ["vlm"]
    image: be-banknote-detector-service:latest
    container_name: security-banknote-detector-service
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./env/banknote-detector-service.env
    restart: unless-stopped
    volumes:
      - /tmp/videos:/tmp/videos
      - ./models:/mnt/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              options:
                mem_limit: "6g"

  # VLM Classification Stage Service — used with banknote detection (STAGE_ORDER=banknote,vlm)
  vlm-classification-service:
    profiles: ["vlm"]
    image: be-vlm-classification-service:latest
    container_name: security-vlm-classification-service
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./env/vlm-classification-service.env
    restart: unless-stopped
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              options:
                mem_limit: "6g"

  # Pipeline Service - Configurable two-stage video processing
  pipeline-service:
    image: be-pipeline-service:latest
    container_name: security-pipeline-service
    depends_on:
      kafka:
        condition: service_healthy
      classification-service:
        condition: service_started
      tracking-service:
        condition: service_started
    env_file:
      - ./env/pipeline-service.env
    restart: unless-stopped

  # Keycloak - Identity and Access Management
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: security-keycloak
    command: start-dev --import-realm
    env_file:
      - ./env/keycloak.env
    ports:
      - "8088:8080"
      - "9088:9000"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e \"GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep \"200\""]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  redis_data:
  huggingface_cache:
